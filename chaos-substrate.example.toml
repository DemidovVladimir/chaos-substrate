# Chaos Substrate runtime config. Copy to chaos-substrate.toml (gitignored).
# Every key can be overridden by an environment variable (see the end).

[storage]
database_url = "postgres://chaos:chaos@localhost:54329/chaos_substrate"

[embedding]
# Real embedders only: "ollama" (local, no API key) or "open_ai" (needs
# OPENAI_API_KEY). Default local model: EmbeddingGemma, 768 dimensions.
#   ollama pull embeddinggemma   (or: bin/chaos ollama-setup)
provider = "ollama"
model = "embeddinggemma"
dimensions = 768
base_url = "http://localhost:11434"

# Cloud alternative:
# provider = "open_ai"
# model = "text-embedding-3-small"
# dimensions = 1536
# base_url is optional for open_ai.

[indexing]
# Directory basenames skipped while walking a repository. This is the
# built-in default; add your own generated/vendored folders.
skip_dirs = [".git", "target", "node_modules", ".venv", "dist", "build", ".next", "coverage"]

# Environment overrides (applied after the file is read):
#   DATABASE_URL, CHAOS_EMBED_PROVIDER (ollama|open_ai), CHAOS_EMBED_MODEL,
#   CHAOS_EMBED_DIMENSIONS, CHAOS_EMBED_BASE_URL.
# Without a file, DATABASE_URL is required and the embedder defaults to
# Ollama embeddinggemma (768d). A .env file is loaded if present.
