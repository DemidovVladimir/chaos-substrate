[package]
name = "chaos-kb"
version = "2.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Personal knowledge base for agents: Markdown notes, local embeddings, cosine search, and block fingerprints that answer 'is this already known?' instantly."

# Standalone crate inside the 1.0 repository; never a member of a parent workspace.
[workspace]

[dependencies]
anyhow = "1"
blake3 = "1"
# clap's defaults without `color`.
clap = { version = "4", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
    "env",
] }
# The dashboard's request parser (already in the build through ureq).
httparse = "1"
pulldown-cmark = { version = "0.13", default-features = false }
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
# No gzip: ureq's 10 MB body cap counts compressed bytes, so a small gzip
# response could inflate past it.
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
