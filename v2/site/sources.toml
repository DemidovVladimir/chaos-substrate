# Site sync map: each feature page → the paths it explains, relative to v2/.
# A path ending in `/` covers every file below it.
#
# After a code change, update every page whose `sources` lists the changed
# file or one of its parent folders, and bump its footer date
# (`Checked against the code on YYYY-MM-DD.`) in the same commit.
# `cargo test --test site` fails when a src/ file is in no page and not in
# [glue], when a path here no longer exists, or when assets/nav.js, this file
# and the .html files disagree on the page list.
#
# Format: full-line comments, [glue] / [pages.<slug>] headers, one
# `sources = [ "path", ... ]` list each (read by tests/site.rs, not a TOML crate).

# Files that only declare modules: no behaviour of their own.
[glue]
sources = [
  "src/adapters/mod.rs",
  "src/domain/mod.rs",
  "src/entry/mod.rs",
]

