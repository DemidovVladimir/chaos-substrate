[package]
name = "chaos-substrate"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Knowledge-graph memory for multi-repository projects: tree-sitter extraction, contextual chunking, pgvector retrieval, six agent tools."

[[bin]]
name = "chaos"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
backon = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures = "0.3"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# Parsing: one tree-sitter core + one grammar crate per language.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-solidity = "1.2"
tree-sitter-graphql = "0.2"

[dev-dependencies]
tempfile = "3"
